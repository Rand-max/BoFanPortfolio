<script>
const projects=[{"video":"assets/女王頭_精華10秒.mp4","image":"assets/bullion.jpg","title":"聖巨金業有限公司 - 女王頭金條動畫","subtitle":"產品動畫","description":"以個人名義接案的金條產品動畫，產品是野柳女王頭紀念條塊，我在動畫中將女王頭分解並重組成金條，以這樣手法來傳達「自然之美與黃金的永恆光澤融為一體」","url":"https://drive.google.com/file/d/1JDq7Mun8x0iPk6siSR-6coMCvvI68LaI/view?usp=sharing"},{"video":"assets/英特力美語.mp4","image":"assets/coverem.jpg","title":"英特力美語 - 宣傳動畫","subtitle":"企業形象動畫","description":"以個人名義接案的美語補習班形象廣告，以科幻+可愛的元素設計十三隻水果機器人，並以其中四隻為主角製作動畫，後續也有幫公司設計角色卡、衣服、筆記本等各式周邊","url":"https://youtu.be/tP8osuzgcbI"},{"video":"assets/杜拜.mp4","image":"assets/bear.jpg","title":"杜拜 海灣資科展 - 光雕動畫","subtitle":"企業形象動畫","description":"杜拜的海灣資科展，動畫以展現台灣價值為主，我在此專案中負責團隊的主美術以及動畫製作","url":"https://youtu.be/B7jHdY-nIVI"},{"video":"assets/晶華.mp4","image":"assets/wedding.jpg","title":"晶華酒店 麗晶之夜 - 光雕動畫","subtitle":"展場動畫","description":"晶華酒店的婚禮展場動畫，這個專案全程以AI製作，以植物和四季為元素製作的自然風格系列動畫，我負責一部份動畫製作以及現場攝影和後續影片的剪輯","url":"https://youtu.be/VWlY8Nf_YY4?list=PLiOO64XgIuiJzqNwjsiXS2_B2MDFszswc"},{"video":"assets/中興.mp4","image":"assets/train.jpg","title":"宜蘭中興 光影互動展 - 光雕動畫","subtitle":"展場動畫","description":"與宜蘭縣政府合作的光影互動展，內容是以中興車站火車為主題的系列光雕動畫，我在專案中負責3D火車動畫以及耶誕主秀動畫，以及現場攝影和後續影片的剪輯","url":"https://youtu.be/93e3t2_4drc"},{"video":"assets/花蓮知卡宣.mp4","image":"assets/col.jpg","title":"花蓮知卡宣 三次常設展 - 光雕動畫","subtitle":"展場動畫","description":"與花蓮縣政府合作的知卡宣公園常設展，參與了三次展覽的動畫製作，負責團隊的主美術和動畫，以及後續影片的剪輯","url":"https://youtu.be/oKw6BDI72F4"},{"video":"assets/磁軌兔.mp4","image":"assets/cover.png","title":"磁軌兔 - 3D裸視動畫","subtitle":"個人形象品牌動畫","description":"以代表自身形象設計的兔子製作一部簡短的3D裸視動畫，畫面走高科技風格，並使用金屬和光條作點綴","url":"https://www.youtube.com/shorts/g0DsePke6m4?feature=share"}];
let index=0,busy=false;
const byId=id=>document.getElementById(id);
const dots=projects.map((project,i)=>{const button=document.createElement('button');button.setAttribute('aria-label',project.title);button.onclick=()=>change(i);document.querySelector('.project-dots').append(button);return button});
function render(){
 const project=projects[index];
 const video=byId('main-video');
 video.pause();
 video.setAttribute('aria-label',project.title);
 video.poster=project.image;
 video.muted=false;
 video.src=project.video;
 video.load();
 video.onloadeddata=async()=>{
   video.currentTime=0;
   try { await video.play(); byId('enable-sound').hidden=true; }
   catch {
     byId('enable-sound').hidden=false;
     video.muted=true;
     video.play().catch(()=>{});
   }
 };
 byId('previous-image').src=projects[(index+6)%7].image;byId('next-image').src=projects[(index+1)%7].image;
 document.querySelectorAll('.project-reflection').forEach(image=>image.remove());
 ['previous-image','next-image'].forEach(id=>{
   const original=byId(id), reflection=original.cloneNode(false);
   reflection.removeAttribute('id');reflection.alt='';reflection.setAttribute('aria-hidden','true');
   reflection.className='project-reflection';original.parentElement.append(reflection);
 });
 byId('main-link').href=byId('project-link').href=project.url;
 byId('main-link').setAttribute('aria-label','觀看完整動畫：'+project.title);
 byId('project-title').textContent=project.title;byId('project-subtitle').textContent=project.subtitle;byId('project-description').textContent=project.description;
 dots.forEach((dot,i)=>dot.setAttribute('aria-current',String(i===index)));
}
async function change(next){
 if(busy||next===index)return;busy=true;
 const direction=next>index?1:-1;
 index=(next+projects.length)%projects.length;
 render();
 if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
 await Promise.all([document.querySelector('.project-stage')].map(el=>el.animate([{opacity:0,transform:'translateX('+direction*24+'px)'},{opacity:1,transform:'translateX(0)'}],{duration:420,easing:'cubic-bezier(.22,1,.36,1)'}).finished));
 }
 busy=false;
}
byId('previous').onclick=document.querySelector('.project-preview.left').onclick=()=>change(index-1);
byId('next').onclick=document.querySelector('.project-preview.right').onclick=()=>change(index+1);
document.querySelector('.projects').addEventListener('keydown',e=>{if(e.key==='ArrowLeft'){e.preventDefault();change(index-1)}if(e.key==='ArrowRight'){e.preventDefault();change(index+1)}});
byId('enable-sound').onclick=()=>{
 const video=byId('main-video');
 video.muted=false;
 video.play().then(()=>{byId('enable-sound').hidden=true;}).catch(()=>{byId('enable-sound').hidden=false;});
};
render();
</script><style>

 mask-image:linear-gradient(to top,rgba(0,0,0,.85),transparent 26%);
 -webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.85),transparent 26%);
}

@media(max-height:550px){.projects{padding-bottom:4svh}.project-info .project-link{padding:5px 18px;font-size:12px;margin-top:8px;margin-bottom:0}.project-nav{margin-top:6px}.projects .project-heading h1{font-size:17px}}
</style></body></html>
