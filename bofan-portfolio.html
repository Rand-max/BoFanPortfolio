(() => {
  const grid = document.getElementById('work-grid');
  const videos = [...grid.querySelectorAll('video')];
  const toggle = document.getElementById('view-toggle');
  const view = document.getElementById('work-view');
  const controls = document.getElementById('single-controls');
  const count = document.getElementById('video-count');
  let single = false, current = 0;
  const previewButtons = [-1, 1].map(direction => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'side-preview ' + (direction < 0 ? 'preview-left' : 'preview-right');
    button.setAttribute('aria-label', direction < 0 ? '觀看上一支動畫' : '觀看下一支動畫');
    const preview = document.createElement('video');
    preview.muted = true;
    preview.playsInline = true;
    preview.preload = 'auto';
    preview.setAttribute('aria-hidden', 'true');
    preview.addEventListener('loadeddata', () => { preview.pause(); preview.currentTime = 0; });
    button.append(preview);
    button.addEventListener('click', () => show(current + direction));
    view.append(button);
    return { preview, direction };
  });
  const play = video => { const result = video.play(); if (result) result.catch(() => {}); };
  let transitioning = false;
  async function show(index) {
    if (transitioning) return;
    const changed = ((index + videos.length) % videos.length) !== current;
    const direction = index > current ? 1 : -1;
    const animate = changed && single && !matchMedia('(prefers-reduced-motion: reduce)').matches;
    const panels = [grid, ...previewButtons.map(({preview}) => preview.parentElement)];
    transitioning = true;
    toggle.disabled = true;
    if (animate) {
      await Promise.all(panels.map(panel => panel.animate([
        {transform:'translateX(0)', opacity: getComputedStyle(panel).opacity},
        {transform:'translateX(' + (-direction * 45) + 'px)', opacity:0}
      ], {duration:180, easing:'ease-in', fill:'forwards'}).finished));
    }
    current = (index + videos.length) % videos.length;
    videos.forEach((video, i) => {
      video.classList.toggle('is-current', i === current);
      if (i !== current) video.pause();
    });
    count.textContent = (current + 1) + ' / ' + videos.length;
    previewButtons.forEach(({preview, direction}) => {
      preview.pause();
      preview.src = videos[(current + direction + videos.length) % videos.length].src;
      preview.load();
    });
    // Restart the central video on every switch; side previews stay paused.
    videos[current].autoplay = true;
    videos[current].pause();
    videos[current].currentTime = 0;
    play(videos[current]);
    panels.forEach(panel => panel.getAnimations().forEach(animation => animation.cancel()));
    if (animate) {
      await Promise.all(panels.map(panel => panel.animate([
        {transform:'translateX(' + (direction * 45) + 'px)', opacity:0},
        {transform:'translateX(0)', opacity:getComputedStyle(panel).opacity}
      ], {duration:320, easing:'cubic-bezier(.22,1,.36,1)'}).finished));
    }
    transitioning = false;
    toggle.disabled = false;
  }
  toggle.addEventListener('click', () => {
    single = !single;
    grid.classList.toggle('single', single);
    grid.classList.add('visible');
    view.classList.toggle('is-single', single);
    controls.hidden = !single;
    toggle.setAttribute('aria-pressed', String(single));
    toggle.textContent = single ? '網格檢視' : '單支檢視';
    if (single) show(current);
    else videos.forEach(video => { video.autoplay = true; play(video); });
  });
  document.getElementById('video-prev').addEventListener('click', () => show(current - 1));
  document.getElementById('video-next').addEventListener('click', () => show(current + 1));
})();
